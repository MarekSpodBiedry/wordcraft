name: fork-check-crates
on:
  push:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxdo-dev libssl-dev libasound2-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (touched crates)
        if: success() || failure()
        run: cargo clippy -p wordcraft-ui-egui --all-targets --locked -- -D warnings
      - name: test (touched crates)
        if: success() || failure()
        run: cargo test -p wordcraft-ui-egui --locked --no-fail-fast
